<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compass Direction Quiz 🧭</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-card">
        <!-- Header -->
        <header class="app-header">
            <span class="badge">kikisaja No. 124</span>
            <h1>🧭 COMPASS DIRECTION QUIZ</h1>
            <p>Uji kemampuanmu menebak derajat sudut arah mata angin!</p>
        </header>

        <!-- Status Panel (Skor & Soal Ke-) -->
        <div class="stats-panel">
            <div class="stat-box">
                <span class="stat-label">Soal</span>
                <strong id="question-number">1 / 10</strong>
            </div>
            <div class="stat-box score">
                <span class="stat-label">Skor</span>
                <strong id="score-display">0</strong>
            </div>
        </div>

        <!-- Pertanyaan / Soal Visual -->
        <div class="question-box" id="question-box">
            <span class="question-subtitle">Berapa derajat sudut untuk arah:</span>
            <h2 id="direction-target">Utara (North)</h2>
        </div>

        <!-- Pilihan Jawaban (Grid 4 Opsi) -->
        <div class="options-grid" id="options-grid">
            <!-- Di-generate otomatis lewat JavaScript -->
        </div>

        <!-- Tombol Lanjut / Restart -->
        <button type="button" id="btn-next" class="btn-next hidden">➡️ LANJUT SOAL BERIKUTNYA</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
